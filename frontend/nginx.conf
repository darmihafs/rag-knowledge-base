# ============================================================================
# 生产前端：静态资源 + 反向代理到后端，浏览器始终同源（与开发期 Vite proxy 行为一致）
#   前端 axios 的 baseURL 是相对路径 '/api'（src/api/http.ts），所以这里代理 /api 即可，
#   不需要任何 CORS 配置，也不需要把后端地址打进前端产物。
# ============================================================================
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    # 文档上传上限要和 spring.servlet.multipart.max-request-size(200MB) 对齐，
    # 否则大文件在 nginx 层就 413 了
    client_max_body_size 200m;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的构建产物可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history 模式：非静态资源一律回落到 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 必须不缓存，否则发版后用户还停留在旧的资源引用上
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE 流式问答：必须关掉缓冲，否则逐字输出会被 nginx 攒成整段一次性下发
        proxy_buffering    off;
        proxy_cache        off;
        proxy_redirect     off;
        add_header         X-Accel-Buffering no;
        # 长回答 + 长上传都别被默认 60s 掐断
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
