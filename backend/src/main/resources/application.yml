server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  # 本地私密配置（数据库密码等），文件已被 .gitignore 忽略；不存在时不报错
  config:
    import: optional:classpath:application-local.yml
  application:
    name: kb-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接信息全部走环境变量，本地默认连本机 MySQL；库名 kb_rag 需先手工创建（见 db/schema.sql）
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:kb_rag}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  # Redis（第十阶段：Query 向量 L2 缓存 / 鉴权与空间集合缓存 / Agent 分布式锁）。
  # 连接信息走环境变量；未部署 Redis 时把 kb.cache.enabled 置 false 即全量本地降级。
  # 命令与连接超时都收短到 2s：Redis 挂掉时让降级尽快发生，而不是把请求挂在默认 60s 超时上。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.bishe.kb.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# RAG 参数，映射到 com.bishe.kb.config.RagProperties
rag:
  api-key: ${RAG_API_KEY:}
  # 百炼(DashScope)兼容模式；换 DeepSeek 填 https://api.deepseek.com/v1，本地 vLLM/Ollama 填 http://127.0.0.1:11434/v1
  base-url: ${RAG_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  chat-model: ${RAG_CHAT_MODEL:qwen-plus}
  embedding-model: ${RAG_EMBEDDING_MODEL:text-embedding-v3}
  # false = 只做解析/分块/落库，不调向量接口；true = 上传时向量化写入本地向量库，问答走「语义+词法」双路召回
  embedding-enabled: ${RAG_EMBEDDING_ENABLED:true}
  # 向量库持久化文件（InMemoryEmbeddingStore 序列化，重启自动加载，零外部依赖）
  embedding-store-path: ${RAG_EMBEDDING_STORE_PATH:./data/embeddings/store.json}
  # 向量存储引擎类型（VectorStoreEngine 条件装配）：
  # local = 内存索引 + 临时文件 ATOMIC_MOVE 原子落盘（默认，零外部依赖）；
  # pgvector = 生产分布式演进预留骨架（尚未实现，误切会让核心操作明确报错而不是静默丢向量）
  vector-store:
    type: ${RAG_VECTOR_STORE_TYPE:local}
  # text-embedding-v3 批量上限较小，按此切批调用，避免服务端拒绝
  embedding-batch-size: ${RAG_EMBEDDING_BATCH_SIZE:10}
  # 问题向量化超时秒数：检索慢就是体验事故，超时应明显短于对话模型的 60 秒，让词法路及时顶上
  embedding-timeout-seconds: ${RAG_EMBEDDING_TIMEOUT_SECONDS:20}
  # 问题向量一级缓存（Caffeine L1）条数上限：同模型同问题的向量是确定性的，只受内存约束；0 = 关闭
  embedding-query-cache-size: ${RAG_EMBEDDING_QUERY_CACHE_SIZE:1000}
  # L1 写后过期分钟数：短时命中反复提问，过期回落 L2 / 远程
  embedding-query-cache-expire-minutes: ${RAG_EMBEDDING_QUERY_CACHE_EXPIRE_MINUTES:5}
  # 问题向量二级缓存（Redis L2）存活小时数，Key=rag:emb:{sha256}；kb.cache.enabled=false 时退回仅 L1
  embedding-l2-ttl-hours: ${RAG_EMBEDDING_L2_TTL_HOURS:24}
  # RRF 倒数排名融合常数 k：得分 = Σ 1/(k + rank)，60 为通用默认
  rrf-k: ${RAG_RRF_K:60}
  # Rerank 精排：双路召回 → RRF 粗排取 candidates 条 → gte-rerank-v2 Cross-Encoder 精排 → 保留 min(top-k, top-n) 条。
  # 复用 rag.api-key；关闭 / 无密钥 / 超时 / 报错时自动降级为 RRF 粗排 Top-K，绝不阻断问答主链路。
  # 注意 1：gte-rerank 系列走百炼原生端点（下方 endpoint），不是 base-url 的 OpenAI 兼容协议地址。
  # 注意 2：默认用 v2——v1 的 gte-rerank 实测返回 403 AccessDenied（已不对该账号开放），v2 报文结构相同。
  rerank:
    enabled: ${RAG_RERANK_ENABLED:true}
    model: ${RAG_RERANK_MODEL:gte-rerank-v2}
    top-n: ${RAG_RERANK_TOP_N:5}
    candidates: ${RAG_RERANK_CANDIDATES:20}
    timeout-seconds: ${RAG_RERANK_TIMEOUT_SECONDS:3}
    endpoint: ${RAG_RERANK_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
  # 语义召回最低相似度阈值，0 = 只按排名截断不做绝对分数过滤（利于同义词命中）
  semantic-min-score: ${RAG_SEMANTIC_MIN_SCORE:0.0}
  # 词法召回实现：fulltext = 走 kb_chunk 的 FULLTEXT ngram 索引（默认）；like = 逐词 LIKE 全表扫描兜底
  # （给 H2 等不支持 MATCH ... AGAINST 的库用；fulltext 下 SQL 一旦异常也会自动退回 like）
  lexical-mode: ${RAG_LEXICAL_MODE:fulltext}
  # true = 不调大模型，用检索结果拼一段演示回答并逐字推送（无密钥时验证 SSE 链路用），生产必须 false
  mock-enabled: ${RAG_MOCK_ENABLED:false}
  temperature: 0.2
  chunk-max-chars: 800
  chunk-overlap-chars: 120
  top-k: 5
  min-score: 0.6
  # 多轮对话记忆：带最近 6 条历史消息（= 3 轮问答），设 0 可退回单轮；单条历史最多 1200 字
  history-messages: ${RAG_HISTORY_MESSAGES:6}
  history-max-chars: 1200
  upload-dir: ./data/uploads
  # 文档异步入库：上传只负责落盘与入队，解析/分块/向量化在后台线程池执行。
  # PDFBox 是 CPU/内存密集型，固定小线程数避免并发大文件打满堆内存；队列满时上传明确失败而非挂起请求。
  ingest-threads: ${RAG_INGEST_THREADS:2}
  ingest-queue-capacity: ${RAG_INGEST_QUEUE_CAPACITY:100}
  # 知识库 Agent：硬超时 90 秒（到点取消 worker 并返回 TIME_LIMIT），独立 4 线程 + 32 排队。
  # 超时不再只在轮次之间检查，供应商 HTTP 挂住也不会让请求永久占线。
  agent-timeout-millis: ${RAG_AGENT_TIMEOUT_MILLIS:90000}
  agent-threads: ${RAG_AGENT_THREADS:4}
  agent-queue-capacity: ${RAG_AGENT_QUEUE_CAPACITY:32}

# 认证与鉴权，映射到 com.bishe.kb.config.AuthProperties
auth:
  # JWT 签名密钥（HS256+ 要求至少 32 字节）。这里刻意不给默认值：密钥一旦写进代码就等于公开，
  # 任何人都能伪造管理员 token。本地写在 git-ignored 的 application-local.yml，
  # 服务器用环境变量 AUTH_JWT_SECRET；两者都缺失时 JwtUtil 直接让启动失败，绝不带默认密钥上线。
  secret: ${AUTH_JWT_SECRET:}
  # token 有效期（分钟），默认 12 小时；改密码/被重置/主动退出会递增 sys_user.token_version 立刻作废旧 token
  expire-minutes: ${AUTH_EXPIRE_MINUTES:720}
  # 测试放行开关：仅测试环境置 true（缺 token 时注入管理员身份），生产必须 false
  test-bypass: ${AUTH_TEST_BYPASS:false}

# 分布式缓存与锁（第十阶段），映射到 com.bishe.kb.config.KbCacheProperties。
# enabled=false 时不装配 RedisCacheService：Query 向量退回 Caffeine L1、鉴权/空间集合每次查库、
# Agent 单用户并发退回进程内闸门。测试 profile 固定关闭，生产默认打开。
kb:
  cache:
    enabled: ${KB_CACHE_ENABLED:true}
    # 鉴权缓存（auth:token_ver:{userId} / auth:spaces:{userId}）存活时间，默认 2 小时
    auth-ttl-hours: ${KB_CACHE_AUTH_TTL_HOURS:2}
    # Agent 单用户分布式锁过期秒数，与 rag.agent-timeout-millis 对齐；持有者崩溃时到点自动释放
    agent-lock-ttl-seconds: ${KB_CACHE_AGENT_LOCK_TTL_SECONDS:90}
    # 探测到 Redis 不可用后的降级背避窗口（毫秒），窗口内不再发起注定失败的连接
    unavailable-backoff-millis: ${KB_CACHE_UNAVAILABLE_BACKOFF_MILLIS:10000}

logging:
  level:
    root: info
    com.bishe.kb: debug
